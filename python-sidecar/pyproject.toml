[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.models"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.db.lancedb_repo"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.index_service"
disallow_any_explicit = false

# 以下三个模块的 BaseModel 由 pydantic.mypy 插件生成显式 Any __init__
# （实测插件对每个 BaseModel 子类都如此，init_typed 不生效），与
# app.models / lancedb_repo / index_service 同源同因，沿用既有 override。
[[tool.mypy.overrides]]
module = "app.rules.models"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.self_correct_service"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.rewrite_service"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.api.routes_metrics"
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# jieba 未提供 py.typed / stubs，运行时为动态模块
module = "jieba"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sentence-transformers 未提供 stubs（内部依赖 torch/transformers），动态模块
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# openpyxl 未内置 py.typed；仅在 doc_extract 惰性导入，动态模块（同 jieba 处理）
module = "openpyxl"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# logging.py 用 Protocol 兼容 structlog / 标准 logging 两种实现，
# structlog 缺 stubs 导致 Any 返回 + unused-ignore 噪声；非 T2.4 引入
module = "app.core.logging"
warn_return_any = false
disable_error_code = ["unused-ignore", "return-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-report=xml"
markers = [
    "e2e: 需真实 Ollama/LanceDB 的端到端测试（RUN_E2E=1 运行）",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
