[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.models"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.db.lancedb_repo"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.index_service"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.api.routes_metrics"
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# jieba 未提供 py.typed / stubs，运行时为动态模块
module = "jieba"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# logging.py 用 Protocol 兼容 structlog / 标准 logging 两种实现，
# structlog 缺 stubs 导致 Any 返回 + unused-ignore 噪声；非 T2.4 引入
module = "app.core.logging"
warn_return_any = false
disable_error_code = ["unused-ignore", "return-value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
