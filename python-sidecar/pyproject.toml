[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# app.models 已拆为包（classify/chat/index/embedding/system）：pydantic.mypy 对
# BaseModel 字段的 Field(...) 生成显式 Any __init__ 语义，故整包沿用既有 override
module = ["app.models", "app.models.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# 同 app.models：pydantic.mypy 对 BaseModel 字段的 Field(...) 生成显式 Any __init__ 语义
module = "app.models.doc_preview"
disallow_any_explicit = false

[[tool.mypy.overrides]]
# lancedb_repo 已拆为同名包（types/tables/chunks/search/manager）：pydantic.mypy 对
# BaseModel 字段生成显式 Any（DocumentChunk 位于 types.py），故整包沿用既有 override
module = ["app.db.lancedb_repo", "app.db.lancedb_repo.*"]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.index_service"
disallow_any_explicit = false

# 以下三个模块的 BaseModel 由 pydantic.mypy 插件生成显式 Any __init__
# （实测插件对每个 BaseModel 子类都如此，init_typed 不生效），与
# app.models / lancedb_repo / index_service 同源同因，沿用既有 override。
[[tool.mypy.overrides]]
module = "app.rules.models"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.self_correct_service"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.services.rewrite_service"
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = "app.api.routes_metrics"
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
# jieba 未提供 py.typed / stubs，运行时为动态模块
module = "jieba"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# sentence-transformers 未提供 stubs（内部依赖 torch/transformers），动态模块
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# onnxruntime / tokenizers 均未提供 py.typed（进程内 Embedding 的后端依赖），
# 动态模块；调用点已用显式断言收敛返回值类型（同 sentence_transformers 处理）
module = "onnxruntime"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tokenizers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# openpyxl 未内置 py.typed；仅在 doc_extract 惰性导入，动态模块（同 jieba 处理）
module = "openpyxl"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# logging.py 用 Protocol 兼容 structlog / 标准 logging 两种实现，
# structlog 缺 stubs 导致 Any 返回 + unused-ignore 噪声；非 T2.4 引入
module = "app.core.logging"
warn_return_any = false
disable_error_code = ["unused-ignore", "return-value"]

[[tool.mypy.overrides]]
# psutil 无 stubs（types-psutil 未随 requirements-dev 安装）。仅在内置 llama.cpp
# 引擎的孤儿清理里用于「该 PID 的可执行文件是不是我们的引擎」，且整段包在宽 except
# 中——取不到信息就保守放弃清理，故丢失类型信息无实际风险（同 jieba 处理）。
module = "psutil"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-report=xml"
markers = [
    "e2e: 需真实 Ollama/LanceDB 的端到端测试（RUN_E2E=1 运行）",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
