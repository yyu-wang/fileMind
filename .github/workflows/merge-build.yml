name: Merge Build

on:
  push:
    branches: [main]
  workflow_dispatch:        # 手动触发：合并到 main 前验证（PR 不会触发 merge-build）
  workflow_call:            # 供 release.yml 复用：tag 发布时在同一 run 内构建，
                            # publish job 可直接 download-artifact 取到本 workflow 的产物
                            # （调用方需 secrets: inherit 才能读到 TAURI_SIGNING_PRIVATE_KEY）

concurrency:
  group: merge-build-${{ github.ref }}
  cancel-in-progress: true  # 新 push 覆盖旧构建，省 runner 分钟

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # 保险阀：历史成功 run 每平台 5-9min（含 PyInstaller + release LTO），冷缓存更久，
    # 取 120min 留足余量；避免偶发卡死一直耗到默认 6h 上限
    timeout-minutes: 120
    strategy:
      fail-fast: false      # 单平台失败不取消其余平台，便于并排查错
      matrix:
        include:
          # Windows x64：原生 runner 先 PyInstaller 产 sidecar（.exe），再 tauri build 出 msi + nsis
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            bundles: msi nsis
            # W1：updater 资产（.sig）必须与安装包一起上传 —— latest.json 的 signature
            # 字段直接取自这些 .sig，缺失则发布环节只能拿手工构建的产物凑
            # （见 docs/auto-update-setup.md §4）
            artifacts: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
          # macOS Apple Silicon（arm64 runner 原生构建）
          # app,dmg：app 目标产出 updater 用的 .tar.gz + .sig（对齐 docs/auto-update-setup.md 发布命令），
          # 同时避免 dmg-only 打包后 .app 被清理导致冒烟检查扑空
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
            bundles: app,dmg
            # W1：同 Windows，.app.tar.gz + .sig 是 darwin-aarch64 的更新资产，必须上传
            artifacts: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sig
          # macOS Intel（x64）job 已移除（2026-09-13）：
          #   1. 原先用的 macos-13 镜像已于 2025-12-04 退役，job 永远排队不被调度；
          #      换成 macos-15-intel 后能调度了，但暴露第 2 点——
          #   2. 上游依赖在 macOS x86_64 上已无 wheel：`lancedb==0.37.1`
          #      （pip: No matching distribution，该平台最高 0.25.3），torch 同样早已停发
          #      macOS x86_64 wheel。故 x64 sidecar 无法用当前依赖集构建。
          #   结合 Apple 已停 Intel 支持、GitHub 将于 macOS 15 之后（2027 秋）退役 Intel
          #   runner，本轮起只分发 macOS arm64 + Windows。若将来仍需 Intel 包，路径是
          #   为该平台单独降级 lancedb/torch（运行时行为会与其它平台分叉，需实测）。
          # 说明：Linux(deb/AppImage) job 暂移除——打包态 Sidecar 解析当前仅支持
          # macOS/Windows（main.rs defer_to_bundle 仅这两平台），Linux 分发改后续版本。
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable   # 原生 runner，目标 triple 即 host，无需额外 targets

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Sidecar 需要 Python 3.12 环境：建 venv 并装运行/打包依赖（PyInstaller 在 requirements-dev）
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Python venv + deps
        shell: bash
        run: |
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then PY=".venv/Scripts/python.exe"; else PY=".venv/bin/python"; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r python-sidecar/requirements.txt -r python-sidecar/requirements-dev.txt

      - run: npm ci

      # Sidecar onedir 产物（体积门控见 scripts/build-sidecar.sh）。
      # ⚠️ 必须在 gen:ipc 之前：cargo run 会触发 tauri-build 的 build.rs，
      #    校验 bundle.resources 声明的 sidecar 产物目录存在，顺序颠倒则直接编译失败。
      - name: Build Sidecar (${{ matrix.label }})
        shell: bash
        run: bash scripts/build-sidecar.sh --target ${{ matrix.target }}

      # src/types/ipc.ts 是 specta 生成的类型文件（gitignored），CI 全新检出没有它；
      # 必须先生成，否则 tsc 报 Cannot find module '@/types/ipc' 全崩。
      - name: Generate IPC types
        run: npm run gen:ipc

      # 原生构建 + bundle.resources 把 sidecar onedir 目录打进安装包
      # （tauri.conf.json: {"../filemind/binaries/filemind-sidecar/": "sidecar"}）
      # TAURI_SIGNING_PRIVATE_KEY：updater 签名私钥（bundle.createUpdaterArtifacts=true 时，
      # msi/nsis/app 目标构建后必须签名更新产物，缺密钥构建直接失败）
      - name: Build Tauri (${{ matrix.label }})
        run: npm run build:tauri -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # 打包态冒烟：安装包内必须真实包含 Sidecar onedir 产物（缺它 = 装完即崩），显式失败
      # P2-2：落地位置由 externalBin（主可执行同目录）改为 resources（$RESOURCE/sidecar/）
      - name: Smoke check Sidecar bundled
        shell: bash
        run: |
          set -e
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            APP="$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)"
            test -n "${APP}"
            test -x "${APP}/Contents/Resources/sidecar/filemind-sidecar"
            test -d "${APP}/Contents/Resources/sidecar/_internal"
            echo "Sidecar bundled (macOS): ${APP}/Contents/Resources/sidecar"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows 资源收集目录 = target/<triple>/release/sidecar（安装器据此打包）
            test -f "src-tauri/target/${{ matrix.target }}/release/sidecar/filemind-sidecar.exe"
            test -d "src-tauri/target/${{ matrix.target }}/release/sidecar/_internal"
            echo "Sidecar resources collected (Windows)"
          fi
          echo "Sidecar bundled OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: filemind-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error        # 该平台应有产物却没产出 → 显式失败
