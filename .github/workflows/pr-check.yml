name: PR Check

on:
  pull_request:
    branches: [main, release/*]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run test:coverage

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff mypy
      - run: pip install -r python-sidecar/requirements.txt -r python-sidecar/requirements-dev.txt
      # 以下步骤统一 working-directory=python-sidecar，让 ruff/mypy/pytest
      # 自然发现 sidecar 的 pyproject.toml；从仓库根调用会绕过配置导致假绿。
      - name: Ruff lint
        working-directory: python-sidecar
        run: ruff check .
      - name: Ruff format check
        working-directory: python-sidecar
        run: ruff format --check .
      - name: mypy (strict)
        working-directory: python-sidecar
        run: mypy --strict app/
      - name: pytest (unit + coverage gate)
        working-directory: python-sidecar
        # 排除需真实 Ollama/LanceDB 的 e2e；--cov 门禁 fail_under=80 生效
        run: pytest tests/ -q --ignore=tests/e2e

  build-check:
    needs: [frontend-check, rust-check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Tauri (dev mode)
        run: npm run build:tauri:dev
