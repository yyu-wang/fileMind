name: PR Check

on:
  pull_request:
    branches: [main, release/*]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # ipc.ts 是 specta 生成的类型文件（gitignored），tsc/lint/vitest 都依赖它；
      # 需要 Rust 工具链跑 `gen:ipc` 生成，否则全新检出报 Cannot find module '@/types/ipc'。
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - run: npm ci
      # tauri-build 的 build.rs 按 bundle.resources 校验 `../filemind/binaries/filemind-sidecar/`
      # 存在性（gitignored，全新检出必缺失），缺失则 cargo 直接失败。本 job 不需要真实
      # sidecar，造占位目录即可（详见脚本头注释）。
      - name: Stub sidecar product dir
        run: bash scripts/stub-sidecar-product.sh
      - name: Generate IPC types
        run: npm run gen:ipc
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:unit
      - run: npm run test:coverage

  rust-check:
    runs-on: ubuntu-latest
    # 保险阀：实测编译 ~6min + 测试 ~1min。若将来再有用例挂死，30min 失败远好过
    # 默认 6h 上限（2026-09-11 曾被 orphan 清理用例卡满 6h 导致整轮 cancelled）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # clippy/test 会编译 tauri 依赖树，需要 WebKitGTK 等系统库（gobject-2.0.pc）
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # 同 frontend-check：cargo clippy/test 会触发 build.rs 的资源存在性校验
      - name: Stub sidecar product dir
        run: bash scripts/stub-sidecar-product.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install ruff mypy
      - run: pip install -r python-sidecar/requirements.txt -r python-sidecar/requirements-dev.txt
      # 以下步骤统一 working-directory=python-sidecar，让 ruff/mypy/pytest
      # 自然发现 sidecar 的 pyproject.toml；从仓库根调用会绕过配置导致假绿。
      - name: Ruff lint
        working-directory: python-sidecar
        run: ruff check .
      - name: Ruff format check
        working-directory: python-sidecar
        run: ruff format --check .
      - name: mypy (strict)
        working-directory: python-sidecar
        run: mypy --strict app/
      - name: pytest (unit + coverage gate)
        working-directory: python-sidecar
        # 排除需真实 Ollama/LanceDB 的 e2e；--cov 门禁 fail_under=80 生效
        run: pytest tests/ -q --ignore=tests/e2e

  build-check:
    needs: [frontend-check, rust-check]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # 下面两步与 merge-build.yml 同理，缺一不可：
      #   1) 占位 sidecar 目录 —— tauri-build 的 build.rs 资源存在性校验
      #   2) gen:ipc —— beforeBuildCommand `npm run build` 里 tsc 依赖 src/types/ipc.ts
      #      （gitignored），且 cargo run 自身也会触发 build.rs，故必须在 1) 之后
      - name: Stub sidecar product dir
        run: bash scripts/stub-sidecar-product.sh
      - name: Generate IPC types
        run: npm run gen:ipc
      - name: Build Tauri (dev mode)
        run: npm run build:tauri:dev
