name: Release

# 发版入口：推 tag 即发布（release.md 流程 —— 先合并到 main，再打 tag）
# 版本号一致性由 scripts/gen-latest-json.py --check-version 在发布前卡住。
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# 发版不自动取消：中途被取消会留下"半发布"的 tag 状态
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 复用 merge-build.yml 的构建配方（同 runner、同顺序、同冒烟检查），
    # 避免两处维护同一套构建步骤而漂移。
    # 被调 workflow 的 job 与本 run 同属一次运行 → 下面的 publish job 能直接
    # download-artifact 拿到它的产物；若改用 workflow_run 跨 run 取产物，
    # 可能拿到 main 上另一次构建的包（与 tag 指向的 commit 不符）。
    uses: ./.github/workflows/merge-build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    # 保险阀：未开签名时是「下载产物 + 生成清单」的分钟级任务；开启签名后要上传/下载
    # 约 656MB 安装包、等 SignPath 处理（策略若要求人工审批还要等审批），故放宽到 90min。
    # 只是上限，不影响未启用签名的路径。
    timeout-minutes: 90
    permissions:
      # job 级 permissions 会覆盖默认值：未列出的 scope 一律变为 none，
      # 因此 SignPath action 读取本次运行 artifact 所需的 actions:read 必须显式写出。
      contents: write # 创建 Release 并上传资产
      actions: read # SignPath action 下载待签名 artifact
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 不带 name 下载本次运行的全部 artifact → dist/filemind-{windows-x64,macos-arm64}/
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      # ── W4：SignPath 签名（仅 Windows 需要 Authenticode；macOS 走 Apple 签名+公证）──
      # 整段由仓库 variable SIGNPATH_ENABLED 门控：未设置时全部跳过，发布行为与 W2 一致。
      # ⚠️ 顺序是硬约束：签名会改变安装包字节 → 构建阶段产出的 .sig 立即失效 →
      #    必须在本段最后的「Re-sign updater artifacts」之后才生成 latest.json。
      - uses: actions/setup-node@v7
        if: vars.SIGNPATH_ENABLED == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Collect Windows installers
        if: vars.SIGNPATH_ENABLED == 'true'
        run: |
          set -euo pipefail
          # 只送安装器本体：.sig 是本机私钥产物，被第三方改动后必须重新生成
          mkdir -p signpath/unsigned
          find dist -type f \( -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp -v {} signpath/unsigned/ \;
          ls -l signpath/unsigned

      # 上传目录（GitHub artifact 是 zip，安装器落在 zip 根）→ 对应
      # .signpath/artifact-configuration.xml 最外层的 <zip-file> 容器
      - name: Upload unsigned installers
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned
          path: signpath/unsigned
          if-no-files-found: error

      - name: SignPath signing request
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 签名策略若要求人工审批，本步骤会一直等到审批完成，故把等待上限放到 30min
          # （必须小于本 job 的 timeout-minutes）
          wait-for-completion-timeout-in-seconds: '1800'
          # 不指定则不下载签名结果；指定后 action 会自动解压到该目录
          output-artifact-directory: signpath/signed

      - name: Replace installers with signed ones
        if: vars.SIGNPATH_ENABLED == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r -d '' signed; do
            name="$(basename "$signed")"
            target="$(find dist -type f -name "$name" -print -quit)"
            if [[ -z "$target" ]]; then
              echo "::error::产物目录中找不到与签名结果同名的文件：$name"
              exit 1
            fi
            cp -v "$signed" "$target"
          done < <(find signpath/signed -type f \( -name '*.msi' -o -name '*-setup.exe' \) -print0)

      - name: Install Tauri CLI
        if: vars.SIGNPATH_ENABLED == 'true'
        run: npm ci --ignore-scripts

      - name: Re-sign updater artifacts
        if: vars.SIGNPATH_ENABLED == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 签名改动了安装包字节 → 覆盖构建阶段那份 .sig，否则 latest.json 里的
          # signature 与安装包不匹配，用户端更新会报「签名不匹配」而直接失败。
          #
          # ⚠️ 必须显式传 -p：`tauri signer sign` 在没有密码入参时会去读 TTY 提示，
          #    CI 无终端 → 报 `incorrect updater private key password: Device not
          #    configured (os error 6)`。密码为空的密钥传 -p '' 即可。
          #   （构建阶段的 bundler 走库调用、不提示，故那里只需 TAURI_SIGNING_PRIVATE_KEY。）
          while IFS= read -r -d '' f; do
            rm -f "${f}.sig"
            npx tauri signer sign -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" "$f"
          done < <(find dist -type f \( -name '*.msi' -o -name '*-setup.exe' \) -print0)
          find dist -type f -name '*.sig' -exec ls -l {} +

      # ─────────────────────────────────────────────────────────────────────────
      - name: Generate latest.json + release notes
        run: |
          set -euo pipefail
          python3 scripts/gen-latest-json.py \
            --dist dist \
            --out-dir release \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --check-version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 资产 = 安装包 / 更新包 + 各自 .sig + latest.json（.sig 是 latest.json 里
          # signature 的来源，必须随 Release 一起留档，便于复核与重放）
          mapfile -t assets < <(find dist -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) | sort)
          assets+=(release/latest.json)
          printf '将上传：\n%s\n' "${assets[@]}"

          # 预发布（v1.0.0-rc.1 等）标记为 prerelease：updater 端点用的是
          # releases/latest/download/latest.json，而 latest 不计入预发布
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          else
            prerelease=()
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "FileMind ${GITHUB_REF_NAME#v}" \
            --notes-file release/release-notes.md \
            "${prerelease[@]}" \
            "${assets[@]}"
