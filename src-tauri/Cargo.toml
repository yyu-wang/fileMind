[package]
name = "filemind"
version = "0.1.0"
description = "Desktop file organizer with RAG Q&A"
authors = ["FileMind"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "filemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
specta = { version = "2.0", features = ["derive"] }
specta-typescript = "0.0.7"
tauri-specta = { version = "2.0", features = ["javascript", "typescript"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
refinery = { version = "0.8", features = ["rusqlite-bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1.10", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
keyring = "3.0"

[dev-dependencies]
tempfile = "3.12"
mockall = "0.13"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[[bin]]
name = "export-specta"
path = "src/bin/export_specta.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = true
