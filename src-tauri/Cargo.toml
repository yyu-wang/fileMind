[package]
name = "filemind"
version = "0.1.0"
description = "Desktop file organizer with RAG Q&A"
authors = ["FileMind"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "filemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
# T6.1：单实例插件，防止二次启动产生孤儿 sidecar（第二个进程会抢端口）
tauri-plugin-single-instance = "2.3"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0"
rusqlite = { version = "0.39", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite-bundled"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
uuid = { version = "1.24", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
# T1.4 握手协议：HMAC-SHA256 签名与随机数生成
hmac = "0.13"
rand = "0.10"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
keyring = "4.1"

[dev-dependencies]
tempfile = "3.27"
mockall = "0.15"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Tauri IPC 命令参数必须按值反序列化（String/State 等），无法改为引用；
# 函数体内以引用转发给 repo 层是正确设计，此 lint 对命令层是框架性误报。
# 仅此一项豁免，不得扩展到其他 lint。
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[[bin]]
name = "export-specta"
path = "src/bin/export_specta.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = true
