[package]
name = "filemind"
version = "0.1.0"
description = "Desktop file organizer with RAG Q&A"
authors = ["FileMind"]
edition = "2021"
rust-version = "1.97"
# 存在 src/bin/export-specta 工具二进制，默认跑主应用（tauri dev 的 cargo run 需要）
default-run = "filemind"

[lib]
name = "filemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# `test` feature：提供 `tauri::test::mock_app`（MockRuntime），供 `tests/tray.rs`
# 在无真实窗口/Wry 环境下注入测试 `handle_tray_menu_event`；不影响生产构建。
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon", "test"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
# T6.1：单实例插件，防止二次启动产生孤儿 sidecar（第二个进程会抢端口）
tauri-plugin-single-instance = "2.3"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
thiserror = "2.0"
rusqlite = { version = "0.39", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite-bundled"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
# T6.6 SSE 流式代理：迭代 bytes_stream 逐块喂给 SseParser
futures-util = "0.3"
uuid = { version = "1.24", features = ["v4"] }
sha2 = "0.11"
hex = "0.4"
# T6.4 文件预览：图片/PDF 内容 base64 编码传输
base64 = "0.22"
# BE-m9：HOME 缺失时解析家目录（unix 走 getpwuid）；已是 tauri 传递依赖，零新增编译
dirs = "6"
# T1.4 握手协议：HMAC-SHA256 签名与随机数生成
hmac = "0.13"
rand = "0.10"
# T6.5 分类规则引擎：rule_type=regex 规则匹配（已是传递依赖，显式声明）
regex = "1.13"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
keyring = "4.1"
# T7.4 云端代理本地 HTTP 服务端：最小特性集（tokio 运行时 + http1 + Path 提取）
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "matched-path"] }
# T7.4 Key 内存清零（unsafe_code=deny，须用零化 crate 的安全 API）
zeroize = "1"
tauri-plugin-wdio-webdriver = "1.3.0"
trash = "5.2.7"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tempfile = "3.27"
# BE-m8 流超时单测：start_paused 虚拟时钟（仅测试编译，release 不启用）
tokio = { version = "1", features = ["test-util"] }
mockall = "0.15"
# 单测构造 mock HTTP 响应（reqwest::Response: From<http::Response>）
http = "1"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Tauri IPC 命令参数必须按值反序列化（String/State 等），无法改为引用；
# 函数体内以引用转发给 repo 层是正确设计，此 lint 对命令层是框架性误报。
# 仅此一项豁免，不得扩展到其他 lint。
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "warn"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[[bin]]
name = "export-specta"
path = "src/bin/export_specta.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
debug = true
